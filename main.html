<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="styles.css">
	<script>
		(function() {
			// Intercept getComputedStyle globally
			const originalGetComputedStyle = window.getComputedStyle;
			window.getComputedStyle = function(el, pseudoElt) {
				const style = originalGetComputedStyle(el, pseudoElt);
				
				// Create a proxy to catch direct object key access (e.g., style.maxWidth)
				return new Proxy(style, {
					get(target, prop) {
						// Catch method calls like style.getPropertyValue('max-width')
						if (prop === 'getPropertyValue') {
							return function(p) {
								if (p === 'max-width' || p === 'maxWidth') return '25vw';
								return target.getPropertyValue(p);
							};
						}
						// Catch direct dot/bracket notations
						if (prop === 'maxWidth' || prop === 'max-width') {
							return '25vw';
						}
						// Handle functions bound to the original object
						const value = target[prop];
						if (typeof value === 'function') {
							return value.bind(target);
						}
						return value;
					}
				});
			};
		})();
	</script>
</head>

<body>
	<main class="cards">

	</main>

</body>
</html>
